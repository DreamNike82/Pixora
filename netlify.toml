[build]
  command = "npm run build"
  publish = "dist"

# API проксюється на бекенд: для браузера це той самий домен, тому CORS не потрібен
[[redirects]]
  from = "/api/*"
  to = "https://pixora-ashy-iota.vercel.app/api/:splat"
  status = 200
  force = true

# SPA-fallback для маршрутів /dashboard, /g/:token тощо
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Приватні сторінки не індексуємо (токен-галереї та кабінет)
[[headers]]
  for = "/g/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
